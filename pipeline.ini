; ============================================================
;  splat-turntable 設定ファイル
;  作業フォルダに pipeline.ini を置くと、そちらが優先されます。
;  ここにない項目は、すべて既定値が使われます。
;  ここは「生成」の設定です。ビューアーの見え方(初期の視点・ズーム等)は、出力先の config.json で変更します。
;  行頭の ; または # はコメント。値のうしろに「 # 説明」も書けます。
; ============================================================

[output]
dir = site                  # 出力フォルダ名(作業フォルダの下)。中に index.html / model.sog / dzi/ などが一式できる
keep_ply = yes              # 学習結果の非圧縮PLYは、SOG変換のための中間ファイル(サイトには入らない)
                            # no=変換後に削除(ディスク節約) / yes=.build/ に残す
                            # yes なら sh_bands だけ変えるとき、再学習せずに作り直せる

[train]                     ; 3DGSの学習 — 時間と品質に最も効くところ
steps = 2000                # 学習ステップ数。多いほど細部が出るが、時間はほぼ比例(30000なら約3倍)
                            # 目安: 1024px画像・10000ステップで約4分(開発機)。解像度やモデルで変わる
max_resolution = 1920       # 学習時に画像を縮小する長辺px。下げると速く軽く、上げると細部が増える
                            # 8K画像のまま渡してOK(ここで自動縮小される)。2D画像側は8Kのまま使われる

[tiles]                     ; 2D画像のディープズーム用タイル
format = webp               # webp(軽い・既定) | jpg(互換性重視)
quality = 85                # 1-100。下げると軽くなる

[compress]
sh_bands = 0                # 3DGSの色の視点依存(SH)を何次まで残すか 0-3。0が最小・最速
                            # 停止時は2D画像が出るので、移動中の見た目だけの問題。気になれば1に

[advanced]                  ; 通常は触らない
tile_size = 510             # タイルのサイズ(px)。大きいとファイル数が減り、1枚あたりは重くなる
jobs = 0                    # タイル変換で同時に処理する画像数。0=自動(コア数の半分)。メモリ不足なら減らす
parallel = yes              # yes: 学習とタイル変換を同時に実行して全体を短縮 / no: 順番に実行
brush_args =                # Brushへ渡す追加オプション(例: --sh-degree 2)。名前は brush --help で確認
